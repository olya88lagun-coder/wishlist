name: preview

on:
  push:
    branches:
      - feat/landing-visual-refresh
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web image
        run: docker build --target web -f apps/web/Dockerfile -t wishlist-web:preview .

      - name: Start preview container
        run: |
          docker run -d --name wishlist-preview -p 3000:3000 \
            -e APP_URL=http://127.0.0.1:3000 \
            -e DATABASE_URL=postgres://preview:preview@127.0.0.1:5432/preview \
            -e SESSION_SECRET=preview-only-session-secret-32-characters-long-1234 \
            -e TELEGRAM_BOT_TOKEN=123456:PREVIEW_TOKEN_ONLY \
            -e TELEGRAM_BOT_USERNAME=my_wish_list1_bot \
            -e VK_CLIENT_ID=54771492 \
            wishlist-web:preview

      - name: Wait for web
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Preview is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs wishlist-preview
          exit 1

      - name: Capture homepage screenshot
        run: |
          docker run --rm --network host \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:3000/', { waitUntil: 'networkidle', timeout: 30000 });
            await page.screenshot({ path: 'preview-homepage.png', fullPage: true });
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: wishlist-preview-${{ github.sha }}
          path: preview-homepage.png
          retention-days: 7

      - name: Preview summary
        run: |
          echo "## Landing preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Rendered successfully from ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"


      - name: Start public preview tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          nohup cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          for i in {1..30}; do
            PREVIEW_URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
            if [ -n "$PREVIEW_URL" ]; then
              echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
              echo "Public preview: $PREVIEW_URL"
              break
            fi
            sleep 2
          done
          if [ -z "${PREVIEW_URL:-}" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi

      - name: Preview URL summary
        run: |
          {
            echo "## 🌐 Live landing preview"
            echo ""
            echo "$PREVIEW_URL"
            echo ""
            echo "This is a temporary Cloudflare Quick Tunnel for this workflow run."
            echo "It remains available while this job is running."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep public preview alive
        run: |
          echo "Preview is live at: $PREVIEW_URL"
          echo "Cancel this workflow when finished reviewing the preview."
          while true; do
            if ! curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "Preview application stopped."
              exit 1
            fi
            sleep 30
          done

      - name: Cleanup
        if: always()
        run: docker rm -f wishlist-preview 2>/dev/null || true
