name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Check deploy configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deployment secrets are not configured yet; deployment will be skipped."
          fi

      - name: Configure SSH
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy web container
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          expected_tag="sha-${GITHUB_SHA:0:7}"
          remote_script="$(mktemp)"
          trap 'rm -f "$remote_script"' EXIT
          cat > "$remote_script" <<'REMOTE'
          set -euo pipefail
          EXPECTED_TAG="${1:?expected tag is required}"
          cd /opt/wishlist
          latest_image="$(docker compose config --images | awk '/wishlist-web/ {print $1; exit}')"
          image_repo="${latest_image%:latest}"
          expected_image="$image_repo:$EXPECTED_TAG"

          for attempt in $(seq 1 24); do
            if docker pull "$expected_image"; then
              break
            fi
            if [[ "$attempt" -eq 24 ]]; then
              echo "Expected image $expected_image was not published in time." >&2
              exit 1
            fi
            sleep 5
          done

          docker tag "$expected_image" "$latest_image"

          # Миграции применяются до перезапуска сайта: иначе новый код обратится к ещё не созданным таблицам.
          # Drizzle пропускает уже применённые миграции, поэтому шаг безопасно повторять.
          # Сервис миграций объявлен с профилем tools, без него compose не покажет образ
          migrate_latest="$(docker compose --profile tools config --images | awk '/wishlist-migrate/ {print $1; exit}')"
          if [[ -z "$migrate_latest" ]]; then
            echo "Migration service is missing from docker-compose.yml." >&2
            exit 1
          fi
          migrate_image="${migrate_latest%:latest}:$EXPECTED_TAG"
          for attempt in $(seq 1 24); do
            if docker pull "$migrate_image"; then
              break
            fi
            if [[ "$attempt" -eq 24 ]]; then
              echo "Migration image $migrate_image was not published in time." >&2
              exit 1
            fi
            sleep 5
          done
          docker tag "$migrate_image" "$migrate_latest"
          # Скрипт приходит на сервер через stdin (bash -s). Без -T и </dev/null compose run
          # дочитает остаток скрипта как свой ввод, и bash молча завершится после миграции.
          docker compose --profile tools run --rm -T migrate </dev/null

          docker compose up -d --force-recreate web

          for attempt in $(seq 1 30); do
            health="$(docker inspect -f '{{.State.Health.Status}}' wishlist-web-1 2>/dev/null || true)"
            if [[ "$health" == "healthy" ]]; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "wishlist-web-1 did not become healthy in time." >&2
              docker inspect -f '{{json .State.Health}}' wishlist-web-1 || true
              exit 1
            fi
            sleep 3
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' wishlist-web-1)" = "healthy"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          curl -fsS https://my-wish-list.online/ > "$tmp/home.html"
          curl -fsS https://my-wish-list.online/gifts > "$tmp/gifts.html"
          curl -fsS https://my-wish-list.online/gifts/for-mom > "$tmp/for-mom.html"
          curl -fsS https://my-wish-list.online/sitemap.xml > "$tmp/sitemap.xml"
          curl -fsS https://my-wish-list.online/robots.txt > "$tmp/robots.txt"

          assert_contains() {
            local needle="$1"
            local file="$2"
            local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "SMOKE TEST FAILED: $label"
              echo "Expected: $needle"
              echo "File: $file"
              case "$file" in
                *.html) grep -o '<title>[^<]*</title>' "$file" | head -1 || true ;;
                *.xml|*.txt) head -c 3000 "$file" || true; echo ;;
              esac
              exit 1
            fi
          }

          assert_contains '<title>Вишлист онлайн — список желаний и подарков | MyWishList</title>' "$tmp/home.html" "home title"
          assert_contains 'rel="canonical" href="https://my-wish-list.online"' "$tmp/home.html" "home canonical"
          assert_contains 'name="yandex-verification"' "$tmp/home.html" "home yandex verification"
          assert_contains 'name="google-site-verification"' "$tmp/home.html" "home google verification"
          assert_contains 'property="og:image"' "$tmp/home.html" "home og:image"

          assert_contains '<title>Идеи подарков — AI-помощник | MyWishList</title>' "$tmp/gifts.html" "gifts title"
          assert_contains 'rel="canonical" href="https://my-wish-list.online/gifts"' "$tmp/gifts.html" "gifts canonical"

          assert_contains '<title>Что подарить маме: 14 идей с ценами | MyWishList</title>' "$tmp/for-mom.html" "for-mom title"
          assert_contains 'rel="canonical" href="https://my-wish-list.online/gifts/for-mom"' "$tmp/for-mom.html" "for-mom canonical"
          assert_contains 'Что подарить маме?' "$tmp/for-mom.html" "for-mom heading"
          assert_contains 'Идеи подарков маме' "$tmp/for-mom.html" "for-mom gift ideas block"
          assert_contains '"@type":"WebPage"' "$tmp/for-mom.html" "for-mom WebPage JSON-LD"
          assert_contains '"@type":"BreadcrumbList"' "$tmp/for-mom.html" "for-mom BreadcrumbList JSON-LD"
          assert_contains 'href="/gifts/birthday"' "$tmp/for-mom.html" "for-mom related link"

          assert_contains 'https://my-wish-list.online/gifts/for-mom' "$tmp/sitemap.xml" "sitemap for-mom"
          assert_contains 'https://my-wish-list.online/gifts/under-20000' "$tmp/sitemap.xml" "sitemap under-20000"
          assert_contains 'Sitemap: https://my-wish-list.online/sitemap.xml' "$tmp/robots.txt" "robots sitemap"

          echo "Deployment, SEO content and smoke tests passed."

          # Диск общий с трекером питания: удаляем только старые образы сайта.
          # Оставляем текущий релиз и один предыдущий, чтобы можно было откатиться.
          mapfile -t old_tags < <(
            docker images "$image_repo" --format '{{.CreatedAt}}\t{{.Tag}}' |
              sort -r |
              awk -F '\t' -v current="$EXPECTED_TAG" '$2 ~ /^sha-/ && $2 != current {print $2}' |
              tail -n +2
          )
          for tag in "${old_tags[@]}"; do
            docker rmi "$image_repo:$tag" >/dev/null || echo "Could not remove $image_repo:$tag" >&2
          done
          echo "Removed ${#old_tags[@]} old web image(s)."
          # Слои без тегов старше суток ни на что не ссылаются
          docker image prune -f --filter "until=24h" >/dev/null || true
          df -h / | awk 'NR == 2 {print "Disk usage: " $3 " of " $2 " (" $5 ")"}'
          # Раннер проверяет эту строку: код 0 без неё значит, что скрипт оборвался на середине
          echo "DEPLOY_SCRIPT_COMPLETE"
          REMOTE

          ssh_args=(
            -i ~/.ssh/deploy_key
            -4
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=3
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
          )

          deploy_log="$(mktemp)"
          for ssh_attempt in 1 2 3; do
            set +e
            ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$expected_tag'" < "$remote_script" | tee "$deploy_log"
            ssh_rc=${PIPESTATUS[0]}
            set -e

            if [[ "$ssh_rc" -eq 0 ]]; then
              if grep -q "DEPLOY_SCRIPT_COMPLETE" "$deploy_log"; then
                exit 0
              fi
              echo "Deploy script exited early without reaching the end; the site may still run the previous release." >&2
              exit 1
            fi

            if [[ "$ssh_rc" -ne 255 || "$ssh_attempt" -eq 3 ]]; then
              exit "$ssh_rc"
            fi

            echo "SSH connection failed (exit 255); retrying in 5 seconds (attempt $((ssh_attempt + 1))/3)." >&2
            sleep 5
          done
